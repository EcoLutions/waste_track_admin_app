<div class="relative min-h-screen flex flex-col items-center justify-center overflow-hidden bg-gradient-to-b from-green-50 to-white text-center">

  <!-- Animated background shapes -->
  <div class="absolute inset-0 overflow-hidden">
    <div class="absolute w-72 h-72 bg-green-200/40 rounded-full blur-3xl animate-float-slow top-10 left-10"></div>
    <div class="absolute w-96 h-96 bg-green-100/50 rounded-full blur-3xl animate-float-slower bottom-10 right-10"></div>
  </div>

  <!-- Main content -->
  <div class="relative z-10 px-6">
    <h1 class="text-[8rem] font-bold text-green-600 leading-none select-none">404</h1>
    <h2 class="text-2xl md:text-3xl font-semibold text-gray-800 mt-4">Página no encontrada</h2>
    <p class="text-gray-500 mt-2 max-w-md mx-auto">
      Lo sentimos, no pudimos encontrar la página que buscabas.<br>
      Puede que haya sido movida o eliminada.
    </p>

    <div class="mt-8 flex flex-col sm:flex-row gap-3 justify-center">
      <button
        type="button"
        (click)="goToDashboard()"
        class="px-6 py-3 bg-green-600 text-white font-medium rounded-xl shadow-md hover:bg-green-700 transition-all duration-200"
      >
        Volver al Dashboard
      </button>

      <button
        type="button"
        (click)="goBack()"
        class="px-6 py-3 border border-gray-300 text-gray-600 font-medium rounded-xl hover:bg-gray-50 transition-all duration-200"
      >
        Regresar
      </button>
    </div>
  </div>
</div>
